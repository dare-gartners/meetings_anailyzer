<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Meeting Notes AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #212529;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      position: relative;
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .app-header h1 { margin: 0 0 0.5rem 0; font-size: 2.5rem; font-weight: 700; }
    .app-subtitle { margin: 0; font-size: 1.125rem; opacity: 0.95; }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
    }

    .header-user {
      position: absolute;
      top: 0; right: 0;
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.875rem; opacity: 0.9;
    }

    .logout-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.25); }

    /* Layout */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: white;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6c757d;
    }

    .new-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .new-btn:hover { opacity: 0.9; }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .sidebar-item {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .sidebar-item:hover { background: #f8f9fa; }
    .sidebar-item.active {
      background: #f0eeff;
      border-left-color: #667eea;
    }

    .sidebar-item-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: #212529;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item-date {
      font-size: 0.75rem;
      color: #6c757d;
      margin-top: 0.15rem;
    }

    .sidebar-empty {
      padding: 1.5rem 1.25rem;
      font-size: 0.875rem;
      color: #6c757d;
      text-align: center;
    }

    /* Main area */
    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
    }

    .main-content {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }

    .card h2 { margin: 0 0 1.25rem 0; font-size: 1.25rem; color: #212529; }

    /* Form */
    .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
    .form-group label { font-weight: 500; margin-bottom: 0.5rem; color: #495057; }

    .form-group input[type="text"] {
      padding: 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      color: #212529;
      transition: border-color 0.2s;
    }
    .form-group input[type="text"]:focus {
      outline: none; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }

    .form-group textarea {
      padding: 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 180px;
      transition: border-color 0.2s;
      color: #212529;
    }
    .form-group textarea:focus {
      outline: none; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Error */
    .error-banner {
      display: none;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9375rem;
    }
    .error-banner.visible { display: block; }

    /* Result card */
    .result-card { display: none; }
    .result-card.visible { display: block; }

    .result-section { margin-bottom: 1.5rem; }
    .result-section:last-child { margin-bottom: 0; }
    .result-section h3 {
      font-size: 0.875rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #6c757d; margin: 0 0 0.75rem 0;
    }

    .summary-text {
      font-size: 1rem; line-height: 1.7; color: #212529; margin: 0;
      background: #f8f9fa; border-left: 4px solid #667eea;
      padding: 1rem 1.25rem; border-radius: 4px;
    }

    .action-items {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .action-items li {
      display: flex; align-items: flex-start; gap: 0.6rem;
      padding: 0.6rem 0.75rem; background: #f8f9fa;
      border-radius: 6px; font-size: 0.9375rem; color: #212529;
    }
    .action-items li::before {
      content: "✓"; color: #667eea; font-weight: 700;
      flex-shrink: 0; margin-top: 1px;
    }

    /* Tags */
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    .tag {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem; font-weight: 500;
    }

    .tag-remove {
      background: none; border: none; cursor: pointer;
      font-size: 1rem; line-height: 1; padding: 0;
      opacity: 0.6; color: inherit;
    }
    .tag-remove:hover { opacity: 1; }

    .tag-add-form {
      display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem;
    }
    .tag-add-form input {
      padding: 0.35rem 0.65rem;
      border: 1px solid #dee2e6; border-radius: 9999px;
      font-size: 0.875rem; font-family: inherit; width: 140px;
    }
    .tag-add-form input:focus {
      outline: none; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    .tag-add-btn {
      background: #667eea; color: white; border: none;
      border-radius: 9999px; padding: 0.35rem 0.85rem;
      font-size: 0.875rem; font-family: inherit; cursor: pointer;
    }
    .tag-add-btn:hover { opacity: 0.9; }
    .tag-error { font-size: 0.8rem; color: #dc3545; margin-top: 0.35rem; }

    /* Detail view */
    .detail-header {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
    }
    .back-btn {
      background: none; border: 1px solid #dee2e6; color: #495057;
      border-radius: 6px; padding: 0.35rem 0.85rem;
      font-size: 0.875rem; font-family: inherit; cursor: pointer;
    }
    .back-btn:hover { background: #f8f9fa; }

    .detail-title { margin: 0; font-size: 1.4rem; font-weight: 700; }
    .detail-date { font-size: 0.85rem; color: #6c757d; margin-top: 0.25rem; }

    .section-divider { border: none; border-top: 1px solid #dee2e6; margin: 1.25rem 0; }

    /* Footer */
    .app-footer {
      text-align: center; padding: 1.25rem;
      background: #f5f5f5; color: #6c757d; font-size: 0.875rem;
      flex-shrink: 0;
    }
    .app-footer p { margin: 0; }

    @media (max-width: 768px) {
      .app-header h1 { font-size: 2rem; }
      .sidebar { width: 200px; }
      .app-main { padding: 1rem; }
      .card { padding: 1.25rem; }
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #f0f0f0; }
      .sidebar { background: #242424; border-color: #3a3a3a; }
      .sidebar-header { border-color: #3a3a3a; }
      .sidebar-item:hover { background: #2e2e2e; }
      .sidebar-item.active { background: #2a2550; border-left-color: #667eea; }
      .sidebar-item-title { color: #f0f0f0; }
      .card { background: #2a2a2a; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
      .card h2 { color: #f0f0f0; }
      .form-group input[type="text"] { background: #333; border-color: #555; color: #f0f0f0; }
      .form-group textarea { background: #333; border-color: #555; color: #f0f0f0; }
      .summary-text { background: #333; color: #f0f0f0; }
      .action-items li { background: #333; color: #f0f0f0; }
      .section-divider { border-color: #444; }
      .result-section h3 { color: #aaa; }
      .app-footer { background: #111; color: #aaa; }
      .back-btn { border-color: #555; color: #ccc; }
      .back-btn:hover { background: #333; }
      .tag-add-form input { background: #333; border-color: #555; color: #f0f0f0; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <h1>📚 Meeting Notes AI</h1>
      <p class="app-subtitle">Paste your meeting notes and get an instant summary, action items, and tags</p>
      <div class="header-user">
        <span>{{ email }}</span>
        <a class="logout-btn" href="/auth/logout">Sign out</a>
      </div>
    </div>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>History</h2>
        <button class="new-btn" id="new-btn">+ New</button>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-empty">No meetings yet.</div>
      </div>
    </aside>

    <!-- Main -->
    <main class="app-main">
    <div class="main-content">

      <!-- Analyze view -->
      <div id="view-analyze">
        <div class="card">
          <h2>Analyze Meeting Notes</h2>
          <div class="error-banner" id="error"></div>
          <form id="form">
            <div class="form-group">
              <label for="title">Meeting title</label>
              <input id="title" type="text" placeholder="e.g. Q2 Planning Sync" />
            </div>
            <div class="form-group">
              <label for="notes">Meeting notes</label>
              <textarea id="notes" placeholder="Paste your meeting notes here..."></textarea>
            </div>
            <button class="submit-btn" type="submit" id="submit-btn">Analyze</button>
          </form>
        </div>

        <div class="card result-card" id="result-card">
          <div class="result-section">
            <h3>Summary</h3>
            <p class="summary-text" id="result-summary"></p>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Action Items</h3>
            <ul class="action-items" id="result-actions"></ul>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Tags</h3>
            <div class="tags" id="result-tags"></div>
          </div>
        </div>
      </div>

      <!-- Detail view -->
      <div id="view-detail" style="display:none;">
        <div class="card">
          <div class="detail-header">
            <button class="back-btn" id="back-btn">← Back</button>
            <div>
              <h2 class="detail-title" id="detail-title"></h2>
              <div class="detail-date" id="detail-date"></div>
            </div>
          </div>

          <div class="result-section">
            <h3>Tags</h3>
            <div class="tags" id="detail-tags"></div>
            <div class="tag-add-form" id="tag-add-form">
              <input type="text" id="tag-input" placeholder="add-tag" maxlength="60" />
              <button class="tag-add-btn" id="tag-add-btn" type="button">Add</button>
            </div>
            <div class="tag-error" id="tag-error"></div>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Summary</h3>
            <p class="summary-text" id="detail-summary"></p>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Action Items</h3>
            <ul class="action-items" id="detail-actions"></ul>
          </div>
        </div>
      </div>

    </div><!-- /.main-content -->
    </main>
  </div>

  <footer class="app-footer">
    <p>📚 Meeting Notes AI &mdash; powered by Azure OpenAI</p>
  </footer>

  <script>
    // ── Tag colour palette (deterministic by name) ──────────────────────────
    const TAG_COLORS = [
      { bg: '#bfdbfe', text: '#1e40af' },
      { bg: '#bbf7d0', text: '#15803d' },
      { bg: '#e9d5ff', text: '#7e22ce' },
      { bg: '#fed7aa', text: '#c2410c' },
      { bg: '#fbcfe8', text: '#be185d' },
      { bg: '#fef08a', text: '#a16207' },
      { bg: '#c7d2fe', text: '#4338ca' },
      { bg: '#fecaca', text: '#b91c1c' },
      { bg: '#99f6e4', text: '#0f766e' },
      { bg: '#a5f3fc', text: '#0e7490' },
    ];
    function tagPalette(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h += name.charCodeAt(i) * (i + 1);
      const c = TAG_COLORS[h % TAG_COLORS.length];
      return { bg: c.bg, color: c.text };
    }

    // ── State ────────────────────────────────────────────────────────────────
    let currentMeetingId = null;

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const viewAnalyze = document.getElementById('view-analyze');
    const viewDetail  = document.getElementById('view-detail');
    const sidebarList = document.getElementById('sidebar-list');
    const form        = document.getElementById('form');
    const submitBtn   = document.getElementById('submit-btn');
    const errorBanner = document.getElementById('error');
    const resultCard  = document.getElementById('result-card');
    const tagInput    = document.getElementById('tag-input');
    const tagError    = document.getElementById('tag-error');

    // ── Sidebar ──────────────────────────────────────────────────────────────
    async function loadSidebar() {
      const res = await fetch('/meetings');
      if (!res.ok) return;
      const meetings = await res.json();
      sidebarList.innerHTML = '';
      if (meetings.length === 0) {
        sidebarList.innerHTML = '<div class="sidebar-empty">No meetings yet.</div>';
        return;
      }
      meetings.forEach(m => {
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (m.id === currentMeetingId ? ' active' : '');
        item.dataset.id = m.id;
        const date = new Date(m.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        item.innerHTML = `<div class="sidebar-item-title">${esc(m.title)}</div><div class="sidebar-item-date">${date}</div>`;
        item.addEventListener('click', () => openMeeting(m.id));
        sidebarList.appendChild(item);
      });
    }

    function setSidebarActive(id) {
      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.id) === id);
      });
    }

    // ── Views ────────────────────────────────────────────────────────────────
    function showAnalyzeView() {
      currentMeetingId = null;
      viewAnalyze.style.display = '';
      viewDetail.style.display  = 'none';
      setSidebarActive(null);
    }

    async function openMeeting(id) {
      const res = await fetch(`/meetings/${id}`);
      if (!res.ok) return;
      const m = await res.json();
      currentMeetingId = id;
      renderDetail(m);
      viewAnalyze.style.display = 'none';
      viewDetail.style.display  = '';
      setSidebarActive(id);
    }

    function renderDetail(m) {
      currentMeetingId = m.id;
      document.getElementById('detail-title').textContent = m.title;
      document.getElementById('detail-date').textContent  =
        new Date(m.created_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      document.getElementById('detail-summary').textContent = m.summary || '—';

      const actions = document.getElementById('detail-actions');
      actions.innerHTML = '';
      (m.action_items || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        actions.appendChild(li);
      });
      if (!m.action_items?.length) actions.innerHTML = '<li>No action items.</li>';

      renderDetailTags(m.tags || [], m.id);

      // Show/hide add-tag form (max 10)
      document.getElementById('tag-add-form').style.display =
        m.tags.length >= 10 ? 'none' : 'flex';
      tagError.textContent = '';
      tagInput.value = '';
    }

    function renderDetailTags(tags, meetingId) {
      const container = document.getElementById('detail-tags');
      container.innerHTML = '';
      tags.forEach(name => {
        const p = tagPalette(name);
        const span = document.createElement('span');
        span.className = 'tag';
        span.style.background = p.bg;
        span.style.color = p.color;
        span.innerHTML = `${esc(name)}<button class="tag-remove" title="Remove tag" data-tag="${esc(name)}">&times;</button>`;
        span.querySelector('.tag-remove').addEventListener('click', () => removeTag(meetingId, name));
        container.appendChild(span);
      });
    }

    // ── Analyze form ─────────────────────────────────────────────────────────
    document.getElementById('new-btn').addEventListener('click', showAnalyzeView);
    document.getElementById('back-btn').addEventListener('click', showAnalyzeView);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const notes = document.getElementById('notes').value.trim();
      if (!title || !notes) {
        errorBanner.textContent = !title && !notes
          ? 'Please fill in the meeting title and notes.'
          : !title ? 'Please fill in the meeting title.'
          : 'Please fill in the meeting notes.';
        errorBanner.classList.add('visible');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Analyzing…';
      errorBanner.classList.remove('visible');
      resultCard.classList.remove('visible');

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, notes }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error: ${res.status}`);
        }
        const data = await res.json();
        renderAnalyzeResult(data);
        await loadSidebar();
      } catch (err) {
        errorBanner.textContent = err.message || 'Something went wrong. Please try again.';
        errorBanner.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Analyze';
      }
    });

    function renderAnalyzeResult(data) {
      document.getElementById('result-summary').textContent = data.summary || '—';

      const actions = document.getElementById('result-actions');
      actions.innerHTML = '';
      const items = Array.isArray(data.action_items) ? data.action_items : [];
      if (!items.length) { actions.innerHTML = '<li>No action items found.</li>'; }
      else items.forEach(item => { const li = document.createElement('li'); li.textContent = item; actions.appendChild(li); });

      const tagsDiv = document.getElementById('result-tags');
      tagsDiv.innerHTML = '';
      const tags = Array.isArray(data.tags) ? data.tags : [];
      if (!tags.length) { tagsDiv.textContent = 'No tags.'; }
      else tags.forEach(name => {
        const p = tagPalette(name);
        const span = document.createElement('span');
        span.className = 'tag';
        span.style.background = p.bg;
        span.style.color = p.color;
        span.textContent = name;
        tagsDiv.appendChild(span);
      });

      resultCard.classList.add('visible');
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Tag add/remove ───────────────────────────────────────────────────────
    const TAG_RE = /^[a-z0-9][a-z0-9-]*$/;

    document.getElementById('tag-add-btn').addEventListener('click', async () => {
      const name = tagInput.value.trim().toLowerCase();
      tagError.textContent = '';
      if (!name) return;
      if (!TAG_RE.test(name)) {
        tagError.textContent = 'Lowercase letters, digits, hyphens only. Must start with a letter or digit.';
        return;
      }
      const res = await fetch(`/meetings/${currentMeetingId}/tags`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      const data = await res.json();
      if (!res.ok) { tagError.textContent = data.detail || 'Could not add tag.'; return; }
      renderDetail(data);
    });

    tagInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('tag-add-btn').click(); } });

    async function removeTag(meetingId, name) {
      const res = await fetch(`/meetings/${meetingId}/tags/${encodeURIComponent(name)}`, { method: 'DELETE' });
      if (!res.ok) return;
      const data = await res.json();
      renderDetail(data);
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    loadSidebar();
  </script>
</body>
</html>
