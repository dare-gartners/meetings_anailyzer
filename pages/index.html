<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 Meeting Notes AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #212529;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      position: relative;
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .app-header h1 { margin: 0 0 0.5rem 0; font-size: 2.5rem; font-weight: 700; }
    .app-subtitle { margin: 0; font-size: 1.125rem; opacity: 0.95; }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
    }

    .header-user {
      position: absolute;
      top: 0; right: 0;
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.875rem; opacity: 0.9;
    }

    .logout-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .logout-btn:hover { background: rgba(255,255,255,0.25); }

    /* Layout */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: white;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6c757d;
    }

    .new-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .new-btn:hover { opacity: 0.9; }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .sidebar-item {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .sidebar-item:hover { background: #f8f9fa; }
    .sidebar-item.active {
      background: #f0eeff;
      border-left-color: #667eea;
    }

    .sidebar-item-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: #212529;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item-date {
      font-size: 0.75rem;
      color: #6c757d;
      margin-top: 0.15rem;
    }

    .sidebar-empty {
      padding: 1.5rem 1.25rem;
      font-size: 0.875rem;
      color: #6c757d;
      text-align: center;
    }

    /* Main area */
    .app-main {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
    }

    .main-content {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }

    .card h2 { margin: 0 0 1.25rem 0; font-size: 1.25rem; color: #212529; }

    /* Form */
    .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
    .form-group label { font-weight: 500; margin-bottom: 0.5rem; color: #495057; }

    .form-group input[type="text"] {
      padding: 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      color: #212529;
      transition: border-color 0.2s;
    }
    .form-group input[type="text"]:focus {
      outline: none; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }

    .form-group textarea {
      padding: 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 180px;
      transition: border-color 0.2s;
      color: #212529;
    }
    .form-group textarea:focus {
      outline: none; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.9; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Error */
    .error-banner {
      display: none;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9375rem;
    }
    .error-banner.visible { display: block; }

    /* Result card */
    .result-card { display: none; }
    .result-card.visible { display: block; }

    .result-section { margin-bottom: 1.5rem; }
    .result-section:last-child { margin-bottom: 0; }
    .result-section h3 {
      font-size: 0.875rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #6c757d; margin: 0 0 0.75rem 0;
    }

    .summary-text {
      font-size: 1rem; line-height: 1.7; color: #212529; margin: 0;
      background: #f8f9fa; border-left: 4px solid #667eea;
      padding: 1rem 1.25rem; border-radius: 4px;
    }

    .action-items {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .action-items li {
      display: flex; align-items: flex-start; gap: 0.6rem;
      padding: 0.6rem 0.75rem; background: #f8f9fa;
      border-radius: 6px; font-size: 0.9375rem; color: #212529;
    }
    .action-items li::before {
      content: "✓"; color: #667eea; font-weight: 700;
      flex-shrink: 0; margin-top: 1px;
    }

    /* Tags */
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

    .tag {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem; font-weight: 500;
    }

    .tag-remove {
      background: none; border: none; cursor: pointer;
      font-size: 1rem; line-height: 1; padding: 0;
      opacity: 0.6; color: inherit;
    }
    .tag-remove:hover { opacity: 1; }

    .tag-add-form {
      display: flex; gap: 0.5rem; align-items: center; margin-top: 0.75rem;
    }
    .tag-add-form input {
      padding: 0.35rem 0.65rem;
      border: 1px solid #dee2e6; border-radius: 9999px;
      font-size: 0.875rem; font-family: inherit; width: 140px;
    }
    .tag-add-form input:focus {
      outline: none; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    .tag-add-btn {
      background: #667eea; color: white; border: none;
      border-radius: 9999px; padding: 0.35rem 0.85rem;
      font-size: 0.875rem; font-family: inherit; cursor: pointer;
    }
    .tag-add-btn:hover { opacity: 0.9; }
    .tag-error { font-size: 0.8rem; color: #dc3545; margin-top: 0.35rem; }

    /* Detail view */
    .detail-header {
      display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
    }
    .back-btn {
      background: none; border: 1px solid #dee2e6; color: #495057;
      border-radius: 6px; padding: 0.35rem 0.85rem;
      font-size: 0.875rem; font-family: inherit; cursor: pointer;
    }
    .back-btn:hover { background: #f8f9fa; }

    .detail-title { margin: 0; font-size: 1.4rem; font-weight: 700; }
    .detail-date { font-size: 0.85rem; color: #6c757d; margin-top: 0.25rem; }

    .section-divider { border: none; border-top: 1px solid #dee2e6; margin: 1.25rem 0; }

    /* Similar meetings */
    .similar-btn {
      background: none; border: 1px solid #667eea; color: #667eea;
      border-radius: 6px; padding: 0.45rem 1rem;
      font-size: 0.875rem; font-family: inherit; cursor: pointer;
      margin-top: 1rem; transition: background 0.15s, color 0.15s;
    }
    .similar-btn:hover:not(:disabled) { background: #667eea; color: white; }
    .similar-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .similar-results { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .similar-empty { font-size: 0.875rem; color: #6c757d; margin-top: 0.75rem; }

    .sim-card { border: 1px solid #dee2e6; border-radius: 8px; overflow: hidden; }

    .sim-card-header {
      display: flex; align-items: center; justify-content: space-between;
      background: #f8f9fa; padding: 0.75rem 1rem; cursor: pointer;
      gap: 1rem;
    }
    .sim-card-header:hover { background: #f0f0f0; }

    .sim-card-header-left { min-width: 0; }
    .sim-card-header-title { font-weight: 600; font-size: 0.9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sim-card-header-date { font-size: 0.78rem; color: #6c757d; margin-top: 0.1rem; }

    .sim-card-header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .sim-badge {
      background: #28a745; color: white; font-size: 0.78rem; font-weight: 600;
      padding: 0.2rem 0.55rem; border-radius: 9999px; white-space: nowrap;
    }
    .sim-expand-btn {
      background: none; border: 1px solid #dee2e6; color: #495057;
      border-radius: 4px; width: 1.6rem; height: 1.6rem; font-size: 1rem;
      cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center;
    }
    .sim-expand-btn:hover { background: #e9ecef; }

    .sim-card-body { padding: 0.9rem 1rem; }

    .sim-chunk {
      font-size: 0.875rem; color: #495057; background: #f8f9fa;
      border-left: 3px solid #667eea; padding: 0.5rem 0.75rem;
      border-radius: 4px; white-space: pre-wrap; word-break: break-word;
    }
    .sim-your-chunk {
      font-size: 0.875rem; color: #0d47a1; background: #e7f1ff;
      border-left: 3px solid #667eea; padding: 0.5rem 0.75rem;
      border-radius: 4px; margin-top: 0.6rem; white-space: pre-wrap; word-break: break-word;
    }
    .sim-your-label { font-size: 0.75rem; font-weight: 600; color: #6c757d; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
    .sim-more-link {
      font-size: 0.8rem; color: #667eea; cursor: pointer;
      margin-top: 0.6rem; display: inline-block; text-decoration: underline;
    }

    /* Similarity table */
    .sim-table-wrap { overflow-x: auto; }
    .sim-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; table-layout: fixed; }
    .sim-table th {
      background: #f8f9fa; padding: 0.5rem 0.75rem; text-align: left;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: #6c757d; border-bottom: 2px solid #dee2e6;
    }
    .sim-table td { padding: 0.75rem; vertical-align: top; border-bottom: 1px solid #f0f0f0; line-height: 1.45; }
    .sim-table .col-your { background: #e7f1ff; }
    .sim-table .col-match { }
    .sim-table .col-score { text-align: center; color: #28a745; font-weight: 600; white-space: nowrap; }
    .sim-table .col-why { text-align: center; }
    .sim-table tr.best-row td { border-top: 2px solid #28a745; border-bottom: 2px solid #28a745; }
    .sim-table tr.best-row td:first-child { border-left: 2px solid #28a745; }
    .sim-table tr.best-row td:last-child { border-right: 2px solid #28a745; }

    .why-btn {
      background: #007bff; color: white; border: none; border-radius: 4px;
      padding: 0.25rem 0.5rem; font-size: 0.78rem; font-family: inherit; cursor: pointer;
    }
    .why-btn:hover { opacity: 0.85; }
    .why-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .explain-row td {
      background: #fff3cd; border-left: 4px solid #ffc107;
      padding: 0.6rem 0.75rem; font-size: 0.85rem; color: #495057; line-height: 1.5;
    }

    /* Footer */
    .app-footer {
      text-align: center; padding: 1.25rem;
      background: #f5f5f5; color: #6c757d; font-size: 0.875rem;
      flex-shrink: 0;
    }
    .app-footer p { margin: 0; }

    @media (max-width: 768px) {
      .app-header h1 { font-size: 2rem; }
      .sidebar { width: 200px; }
      .app-main { padding: 1rem; }
      .card { padding: 1.25rem; }
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #f0f0f0; }
      .sidebar { background: #242424; border-color: #3a3a3a; }
      .sidebar-header { border-color: #3a3a3a; }
      .sidebar-item:hover { background: #2e2e2e; }
      .sidebar-item.active { background: #2a2550; border-left-color: #667eea; }
      .sidebar-item-title { color: #f0f0f0; }
      .card { background: #2a2a2a; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
      .card h2 { color: #f0f0f0; }
      .form-group input[type="text"] { background: #333; border-color: #555; color: #f0f0f0; }
      .form-group textarea { background: #333; border-color: #555; color: #f0f0f0; }
      .summary-text { background: #333; color: #f0f0f0; }
      .action-items li { background: #333; color: #f0f0f0; }
      .section-divider { border-color: #444; }
      .result-section h3 { color: #aaa; }
      .app-footer { background: #111; color: #aaa; }
      .back-btn { border-color: #555; color: #ccc; }
      .back-btn:hover { background: #333; }
      .tag-add-form input { background: #333; border-color: #555; color: #f0f0f0; }
      .similar-empty { color: #aaa; }
      .sim-card { border-color: #3a3a3a; }
      .sim-card-header { background: #2e2e2e; }
      .sim-card-header:hover { background: #383838; }
      .sim-card-header-date { color: #aaa; }
      .sim-expand-btn { border-color: #555; color: #ccc; }
      .sim-expand-btn:hover { background: #444; }
      .sim-chunk { background: #333; color: #ccc; }
      .sim-your-chunk { background: #1a2a44; color: #90caf9; }
      .sim-table th { background: #2e2e2e; color: #aaa; border-color: #444; }
      .sim-table td { border-color: #3a3a3a; }
      .sim-table .col-your { background: #1a2a44; }
      .explain-row td { background: #2a2200; border-left-color: #ffc107; color: #ccc; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <h1>📚 Meeting Notes AI</h1>
      <p class="app-subtitle">Paste your meeting notes and get an instant summary, action items, and tags</p>
      <div class="header-user">
        <span>{{ email }}</span>
        <a class="logout-btn" href="/auth/logout">Sign out</a>
      </div>
    </div>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>History</h2>
        <button class="new-btn" id="new-btn">+ New</button>
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-empty">No meetings yet.</div>
      </div>
    </aside>

    <!-- Main -->
    <main class="app-main">
    <div class="main-content">

      <!-- Analyze view -->
      <div id="view-analyze">
        <div class="card">
          <h2>Analyze Meeting Notes</h2>
          <div class="error-banner" id="error"></div>
          <form id="form">
            <div class="form-group">
              <label for="title">Meeting title</label>
              <input id="title" type="text" placeholder="e.g. Q2 Planning Sync" />
            </div>
            <div class="form-group">
              <label for="notes">Meeting notes</label>
              <textarea id="notes" placeholder="Paste your meeting notes here..."></textarea>
            </div>
            <button class="submit-btn" type="submit" id="submit-btn">Analyze</button>
          </form>
        </div>

        <div class="card result-card" id="result-card">
          <div class="result-section">
            <h3>Summary</h3>
            <p class="summary-text" id="result-summary"></p>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Action Items</h3>
            <ul class="action-items" id="result-actions"></ul>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Tags</h3>
            <div class="tags" id="result-tags"></div>
          </div>
        </div>
      </div>

      <!-- Detail view -->
      <div id="view-detail" style="display:none;">
        <div class="card">
          <div class="detail-header">
            <button class="back-btn" id="back-btn">← Back</button>
            <div>
              <h2 class="detail-title" id="detail-title"></h2>
              <div class="detail-date" id="detail-date"></div>
            </div>
          </div>

          <div class="result-section">
            <h3>Tags</h3>
            <div class="tags" id="detail-tags"></div>
            <div class="tag-add-form" id="tag-add-form">
              <input type="text" id="tag-input" placeholder="add-tag" maxlength="60" />
              <button class="tag-add-btn" id="tag-add-btn" type="button">Add</button>
            </div>
            <div class="tag-error" id="tag-error"></div>
            <button class="similar-btn" id="similar-btn" type="button">Find similar meetings</button>
            <div class="similar-results" id="similar-results" style="display:none;"></div>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Summary</h3>
            <p class="summary-text" id="detail-summary"></p>
          </div>
          <hr class="section-divider" />
          <div class="result-section">
            <h3>Action Items</h3>
            <ul class="action-items" id="detail-actions"></ul>
          </div>
        </div>
      </div>

    </div><!-- /.main-content -->
    </main>
  </div>

  <footer class="app-footer">
    <p>📚 Meeting Notes AI &mdash; powered by Azure OpenAI</p>
  </footer>

  <script>
    // ── Tag colour palette (deterministic by name) ──────────────────────────
    const TAG_COLORS = [
      { bg: '#bfdbfe', text: '#1e40af' },
      { bg: '#bbf7d0', text: '#15803d' },
      { bg: '#e9d5ff', text: '#7e22ce' },
      { bg: '#fed7aa', text: '#c2410c' },
      { bg: '#fbcfe8', text: '#be185d' },
      { bg: '#fef08a', text: '#a16207' },
      { bg: '#c7d2fe', text: '#4338ca' },
      { bg: '#fecaca', text: '#b91c1c' },
      { bg: '#99f6e4', text: '#0f766e' },
      { bg: '#a5f3fc', text: '#0e7490' },
    ];
    function tagPalette(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h += name.charCodeAt(i) * (i + 1);
      const c = TAG_COLORS[h % TAG_COLORS.length];
      return { bg: c.bg, color: c.text };
    }

    // ── State ────────────────────────────────────────────────────────────────
    let currentMeetingId = null;

    // ── DOM refs ─────────────────────────────────────────────────────────────
    const viewAnalyze = document.getElementById('view-analyze');
    const viewDetail  = document.getElementById('view-detail');
    const sidebarList = document.getElementById('sidebar-list');
    const form        = document.getElementById('form');
    const submitBtn   = document.getElementById('submit-btn');
    const errorBanner = document.getElementById('error');
    const resultCard  = document.getElementById('result-card');
    const tagInput    = document.getElementById('tag-input');
    const tagError    = document.getElementById('tag-error');

    // ── Sidebar ──────────────────────────────────────────────────────────────
    async function loadSidebar() {
      const res = await fetch('/meetings');
      if (!res.ok) return;
      const meetings = await res.json();
      sidebarList.innerHTML = '';
      if (meetings.length === 0) {
        sidebarList.innerHTML = '<div class="sidebar-empty">No meetings yet.</div>';
        return;
      }
      meetings.forEach(m => {
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (m.id === currentMeetingId ? ' active' : '');
        item.dataset.id = m.id;
        const date = new Date(m.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        item.innerHTML = `<div class="sidebar-item-title">${esc(m.title)}</div><div class="sidebar-item-date">${date}</div>`;
        item.addEventListener('click', () => openMeeting(m.id));
        sidebarList.appendChild(item);
      });
    }

    function setSidebarActive(id) {
      document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.id) === id);
      });
    }

    // ── Views ────────────────────────────────────────────────────────────────
    function showAnalyzeView() {
      currentMeetingId = null;
      document.getElementById('title').value = '';
      document.getElementById('notes').value = '';
      errorBanner.classList.remove('visible');
      resultCard.classList.remove('visible');
      viewAnalyze.style.display = '';
      viewDetail.style.display  = 'none';
      setSidebarActive(null);
    }

    async function openMeeting(id) {
      const res = await fetch(`/meetings/${id}`);
      if (!res.ok) return;
      const m = await res.json();
      currentMeetingId = id;
      renderDetail(m);
      viewAnalyze.style.display = 'none';
      viewDetail.style.display  = '';
      setSidebarActive(id);
    }

    function renderDetail(m) {
      currentMeetingId = m.id;
      document.getElementById('detail-title').textContent = m.title;
      document.getElementById('detail-date').textContent  =
        new Date(m.created_at).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      document.getElementById('detail-summary').textContent = m.summary || '—';

      const actions = document.getElementById('detail-actions');
      actions.innerHTML = '';
      (m.action_items || []).forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        actions.appendChild(li);
      });
      if (!m.action_items?.length) actions.innerHTML = '<li>No action items.</li>';

      renderDetailTags(m.tags || [], m.id);

      // Show/hide add-tag form (max 10)
      document.getElementById('tag-add-form').style.display =
        m.tags.length >= 10 ? 'none' : 'flex';
      tagError.textContent = '';
      tagInput.value = '';
      const sr = document.getElementById('similar-results');
      sr.style.display = 'none';
      sr.innerHTML = '';
    }

    function renderDetailTags(tags, meetingId) {
      const container = document.getElementById('detail-tags');
      container.innerHTML = '';
      tags.forEach(name => {
        const p = tagPalette(name);
        const span = document.createElement('span');
        span.className = 'tag';
        span.style.background = p.bg;
        span.style.color = p.color;
        span.innerHTML = `${esc(name)}<button class="tag-remove" title="Remove tag" data-tag="${esc(name)}">&times;</button>`;
        span.querySelector('.tag-remove').addEventListener('click', () => removeTag(meetingId, name));
        container.appendChild(span);
      });
    }

    // ── Analyze form ─────────────────────────────────────────────────────────
    document.getElementById('new-btn').addEventListener('click', showAnalyzeView);
    document.getElementById('back-btn').addEventListener('click', showAnalyzeView);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const notes = document.getElementById('notes').value.trim();
      if (!title || !notes) {
        errorBanner.textContent = !title && !notes
          ? 'Please fill in the meeting title and notes.'
          : !title ? 'Please fill in the meeting title.'
          : 'Please fill in the meeting notes.';
        errorBanner.classList.add('visible');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Analyzing…';
      errorBanner.classList.remove('visible');
      resultCard.classList.remove('visible');

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, notes }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error: ${res.status}`);
        }
        const data = await res.json();
        renderAnalyzeResult(data);
        await loadSidebar();
      } catch (err) {
        errorBanner.textContent = err.message || 'Something went wrong. Please try again.';
        errorBanner.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Analyze';
      }
    });

    function renderAnalyzeResult(data) {
      document.getElementById('result-summary').textContent = data.summary || '—';

      const actions = document.getElementById('result-actions');
      actions.innerHTML = '';
      const items = Array.isArray(data.action_items) ? data.action_items : [];
      if (!items.length) { actions.innerHTML = '<li>No action items found.</li>'; }
      else items.forEach(item => { const li = document.createElement('li'); li.textContent = item; actions.appendChild(li); });

      const tagsDiv = document.getElementById('result-tags');
      tagsDiv.innerHTML = '';
      const tags = Array.isArray(data.tags) ? data.tags : [];
      if (!tags.length) { tagsDiv.textContent = 'No tags.'; }
      else tags.forEach(name => {
        const p = tagPalette(name);
        const span = document.createElement('span');
        span.className = 'tag';
        span.style.background = p.bg;
        span.style.color = p.color;
        span.textContent = name;
        tagsDiv.appendChild(span);
      });

      resultCard.classList.add('visible');
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── Tag add/remove ───────────────────────────────────────────────────────
    const TAG_RE = /^[a-z0-9][a-z0-9-]*$/;

    document.getElementById('tag-add-btn').addEventListener('click', async () => {
      const name = tagInput.value.trim().toLowerCase();
      tagError.textContent = '';
      if (!name) return;
      if (!TAG_RE.test(name)) {
        tagError.textContent = 'Lowercase letters, digits, hyphens only. Must start with a letter or digit.';
        return;
      }
      const res = await fetch(`/meetings/${currentMeetingId}/tags`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      const data = await res.json();
      if (!res.ok) { tagError.textContent = data.detail || 'Could not add tag.'; return; }
      renderDetail(data);
    });

    tagInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('tag-add-btn').click(); } });

    async function removeTag(meetingId, name) {
      const res = await fetch(`/meetings/${meetingId}/tags/${encodeURIComponent(name)}`, { method: 'DELETE' });
      if (!res.ok) return;
      const data = await res.json();
      renderDetail(data);
    }

    // ── Similar meetings ─────────────────────────────────────────────────────
    document.getElementById('similar-btn').addEventListener('click', async () => {
      const btn = document.getElementById('similar-btn');
      const container = document.getElementById('similar-results');
      btn.disabled = true;
      btn.textContent = 'Searching…';
      container.style.display = 'none';
      container.innerHTML = '';

      try {
        const res = await fetch(`/meetings/${currentMeetingId}/similar`, { method: 'POST' });
        if (!res.ok) throw new Error('Request failed');
        const results = await res.json();
        container.style.display = 'flex';

        if (results.length === 0) {
          container.innerHTML = '<div class="similar-empty">No similar meetings found.</div>';
        } else {
          results.forEach(m => buildSimCard(m, container));
        }
      } catch {
        container.style.display = 'flex';
        container.innerHTML = '<div class="similar-empty">Could not load similar meetings.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Find similar meetings';
      }
    });

    function firstLine(text) {
      return (text || '').split('\n')[0].trim();
    }

    function buildSimCard(m, container) {
      const matches = m.all_matches.slice(0, 3);
      const date = new Date(m.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const pct = Math.round(m.score * 100);

      const card = document.createElement('div');
      card.className = 'sim-card';

      // Header
      const header = document.createElement('div');
      header.className = 'sim-card-header';
      header.innerHTML = `
        <div class="sim-card-header-left">
          <div class="sim-card-header-title">${esc(m.title)}</div>
          <div class="sim-card-header-date">${date}</div>
        </div>
        <div class="sim-card-header-right">
          <span class="sim-badge">${pct}% similar</span>
          <button class="sim-expand-btn" type="button" title="Expand">+</button>
        </div>`;
      header.querySelector('.sim-card-header-title').style.cursor = 'pointer';
      header.querySelector('.sim-card-header-title').addEventListener('click', (e) => { e.stopPropagation(); openMeeting(m.id); });

      // Table — always rendered; rows beyond first are hidden until expanded
      const tableWrap = document.createElement('div');
      tableWrap.className = 'sim-table-wrap';
      tableWrap.innerHTML = buildSimTable(m);

      // Wire Why? buttons
      tableWrap.querySelectorAll('.why-btn').forEach((whyBtn, idx) => {
        whyBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const match = matches[idx];
          const existingRow = tableWrap.querySelector(`[data-explain-row="${idx}"]`);
          if (existingRow) { existingRow.remove(); whyBtn.textContent = 'Why?'; return; }
          whyBtn.disabled = true;
          whyBtn.textContent = '…';
          try {
            const res = await fetch('/matches/explain', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                source_chunk: match.source_description || match.source_chunk,
                matched_chunk: match.matched_description || match.matched_chunk,
              }),
            });
            const data = await res.json();
            const tr = tableWrap.querySelector(`[data-row="${idx}"]`);
            const explainTr = document.createElement('tr');
            explainTr.className = 'explain-row';
            explainTr.dataset.explainRow = idx;
            const text = data.explanation || data.detail || 'Could not generate explanation.';
            explainTr.innerHTML = `<td colspan="4">${esc(text)}</td>`;
            tr.insertAdjacentElement('afterend', explainTr);
            whyBtn.textContent = 'Hide';
          } catch (err) {
            whyBtn.textContent = 'Error';
            setTimeout(() => { whyBtn.textContent = 'Why?'; }, 2000);
          } finally {
            whyBtn.disabled = false;
          }
        });
      });

      // Toggle: show/hide extra rows and the "more" footer row
      let expanded = false;
      const expandBtn = header.querySelector('.sim-expand-btn');
      function toggleExpand(e) {
        if (e) e.stopPropagation();
        expanded = !expanded;
        tableWrap.querySelectorAll('tr[data-row]').forEach((tr, i) => {
          if (i > 0) tr.style.display = expanded ? '' : 'none';
        });
        const moreRow = tableWrap.querySelector('.more-row');
        if (moreRow) moreRow.style.display = expanded ? 'none' : '';
        expandBtn.textContent = expanded ? '−' : '+';
      }
      expandBtn.addEventListener('click', toggleExpand);
      tableWrap.querySelector('.sim-more-link')?.addEventListener('click', (e) => { e.stopPropagation(); toggleExpand(null); });

      card.appendChild(header);
      card.appendChild(tableWrap);
      container.appendChild(card);
    }

    function buildSimTable(m) {
      const allMatches = m.all_matches.slice(0, 3);
      const extra = allMatches.length - 1;
      const rows = allMatches.map((match, idx) => {
        const pct = Math.round(match.score * 100);
        const srcLabel = match.source_description || firstLine(match.source_chunk);
        const matchLabel = match.matched_description || firstLine(match.matched_chunk);
        const hidden = idx > 0 ? ' style="display:none"' : '';
        return `<tr class="${match.is_best ? 'best-row' : ''}" data-row="${idx}"${hidden}>
          <td class="col-your">${esc(srcLabel)}</td>
          <td class="col-match">${esc(matchLabel)}</td>
          <td class="col-score">${pct}%</td>
          <td class="col-why"><button class="why-btn" type="button">Why?</button></td>
        </tr>`;
      }).join('');
      const moreRow = extra > 0
        ? `<tr class="more-row"><td colspan="4"><span class="sim-more-link">+ ${extra} more matching topic${extra > 1 ? 's' : ''}</span></td></tr>`
        : '';
      return `<table class="sim-table">
        <colgroup>
          <col>
          <col>
          <col style="width:52px">
          <col style="width:72px">
        </colgroup>
        <thead><tr>
          <th>This meeting</th>
          <th>${esc(m.title)}</th>
          <th>Match</th>
          <th></th>
        </tr></thead>
        <tbody>${rows}${moreRow}</tbody>
      </table>`;
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    loadSidebar();
  </script>
</body>
</html>
