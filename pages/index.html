<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Notes AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #212529;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .app-header {
      position: relative;
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .app-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
      font-weight: 700;
    }

    .app-subtitle {
      margin: 0;
      font-size: 1.125rem;
      opacity: 0.95;
    }

    .header-user {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .logout-btn {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* Main */
    .app-main {
      flex: 1;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }

    .card h2 {
      margin: 0 0 1.25rem 0;
      font-size: 1.25rem;
      color: #212529;
    }

    /* Form */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1rem;
    }

    .form-group label {
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: #495057;
    }

    .form-group textarea {
      padding: 0.75rem;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      min-height: 180px;
      transition: border-color 0.2s;
      color: #212529;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }

    .submit-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .submit-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Results */
    .result-card { display: none; }
    .result-card.visible { display: block; }

    .result-section {
      margin-bottom: 1.5rem;
    }

    .result-section:last-child {
      margin-bottom: 0;
    }

    .result-section h3 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6c757d;
      margin: 0 0 0.75rem 0;
    }

    .summary-text {
      font-size: 1rem;
      line-height: 1.7;
      color: #212529;
      margin: 0;
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 1rem 1.25rem;
      border-radius: 4px;
    }

    .action-items {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .action-items li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.6rem 0.75rem;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 0.9375rem;
      color: #212529;
    }

    .action-items li::before {
      content: "✓";
      color: #667eea;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      background: #e9ecef;
      color: #495057;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    /* Error */
    .error-banner {
      display: none;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9375rem;
    }

    .error-banner.visible { display: block; }

    /* Divider between sections */
    .section-divider {
      border: none;
      border-top: 1px solid #dee2e6;
      margin: 1.25rem 0;
    }

    /* Footer */
    .app-footer {
      text-align: center;
      padding: 1.25rem;
      background: #f5f5f5;
      color: #6c757d;
      font-size: 0.875rem;
    }

    .app-footer p { margin: 0; }

    /* Responsive */
    @media (max-width: 768px) {
      .app-header h1 { font-size: 2rem; }
      .app-subtitle { font-size: 1rem; }
      .app-main { padding: 1rem; }
      .card { padding: 1.25rem; }
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #f0f0f0; }
      .card { background: #2a2a2a; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
      .card h2 { color: #f0f0f0; }
      .form-group textarea { background: #333; border-color: #555; color: #f0f0f0; }
      .summary-text { background: #333; color: #f0f0f0; }
      .action-items li { background: #333; color: #f0f0f0; }
      .tag { background: #444; color: #ccc; }
      .section-divider { border-color: #444; }
      .result-section h3 { color: #aaa; }
      .app-footer { background: #111; color: #aaa; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Meeting Notes AI</h1>
    <p class="app-subtitle">Paste your meeting notes and get an instant summary, action items, and tags</p>
    <div class="header-user">
      <span>{{ email }}</span>
      <a class="logout-btn" href="/auth/logout">Sign out</a>
    </div>
  </header>

  <main class="app-main">
    <div class="card">
      <h2>Analyze Meeting Notes</h2>
      <div class="error-banner" id="error"></div>
      <form id="form">
        <div class="form-group">
          <label for="notes">Meeting notes</label>
          <textarea id="notes" placeholder="Paste your meeting notes here..."></textarea>
        </div>
        <button class="submit-btn" type="submit" id="submit-btn">Analyze</button>
      </form>
    </div>

    <div class="card result-card" id="result-card">
      <div class="result-section" id="section-summary">
        <h3>Summary</h3>
        <p class="summary-text" id="result-summary"></p>
      </div>

      <hr class="section-divider" />

      <div class="result-section" id="section-actions">
        <h3>Action Items</h3>
        <ul class="action-items" id="result-actions"></ul>
      </div>

      <hr class="section-divider" />

      <div class="result-section" id="section-tags">
        <h3>Tags</h3>
        <div class="tags" id="result-tags"></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <p>Meeting Notes AI &mdash; powered by Azure OpenAI</p>
  </footer>

  <script>
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit-btn');
    const errorBanner = document.getElementById('error');
    const resultCard = document.getElementById('result-card');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const notes = document.getElementById('notes').value.trim();
      if (!notes) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Analyzing…';
      errorBanner.classList.remove('visible');
      resultCard.classList.remove('visible');

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `Server error: ${res.status}`);
        }

        const data = await res.json();
        renderResult(data);
      } catch (err) {
        errorBanner.textContent = err.message || 'Something went wrong. Please try again.';
        errorBanner.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Analyze';
      }
    });

    function renderResult(data) {
      // Summary
      document.getElementById('result-summary').textContent = data.summary || '—';

      // Action items
      const actionsList = document.getElementById('result-actions');
      actionsList.innerHTML = '';
      const items = Array.isArray(data.action_items) ? data.action_items : [];
      if (items.length === 0) {
        actionsList.innerHTML = '<li>No action items found.</li>';
      } else {
        items.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          actionsList.appendChild(li);
        });
      }

      // Tags
      const tagsDiv = document.getElementById('result-tags');
      tagsDiv.innerHTML = '';
      const tags = Array.isArray(data.tags) ? data.tags : [];
      if (tags.length === 0) {
        tagsDiv.textContent = 'No tags.';
      } else {
        tags.forEach(tag => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = tag;
          tagsDiv.appendChild(span);
        });
      }

      resultCard.classList.add('visible');
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  </script>
</body>
</html>
