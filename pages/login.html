<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Meeting Notes AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      color: #212529;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .app-header {
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .app-header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
      font-weight: 700;
    }

    .app-subtitle {
      margin: 0;
      font-size: 1.125rem;
      opacity: 0.95;
    }

    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: white;
      border-radius: 8px;
      padding: 2.5rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .login-card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.375rem;
      color: #212529;
    }

    .login-card p {
      margin: 0 0 2rem 0;
      color: #6c757d;
      font-size: 0.9375rem;
    }

    .signin-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.8rem 1.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .signin-btn:hover {
      opacity: 0.9;
    }

    .signin-btn svg {
      flex-shrink: 0;
    }

    .error-msg {
      display: none;
      margin-top: 1.25rem;
      color: #721c24;
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
    }

    .error-msg.visible { display: block; }

    .app-footer {
      text-align: center;
      padding: 1.25rem;
      background: #f5f5f5;
      color: #6c757d;
      font-size: 0.875rem;
    }

    .app-footer p { margin: 0; }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a1a; color: #f0f0f0; }
      .login-card { background: #2a2a2a; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
      .login-card h2 { color: #f0f0f0; }
      .login-card p { color: #aaa; }
      .error-msg { background: #3a1a1d; border-color: #7a3030; color: #f0a0a0; }
      .app-footer { background: #111; color: #aaa; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Meeting Notes AI</h1>
    <p class="app-subtitle">Instant summaries, action items, and tags</p>
  </header>

  <div class="login-wrap">
    <div class="login-card">
      <h2>Welcome</h2>
      <p>Sign in with your Adobe account to continue.</p>

      <a class="signin-btn" href="/auth/okta/login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18a8 8 0 110-16 8 8 0 010 16zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="white"/>
        </svg>
        Sign in with Adobe (Okta)
      </a>

      {% if request.query_params.get("error") %}
      <div class="error-msg visible">
        Authentication failed. Please try again.
      </div>
      {% endif %}
    </div>
  </div>

  <footer class="app-footer">
    <p>Meeting Notes AI &mdash; powered by Azure OpenAI</p>
  </footer>

</body>
</html>
